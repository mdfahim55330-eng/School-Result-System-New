<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - School Result</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: rgb(245, 224, 224);
            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .title p {
            margin: 0;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="title">

                <h1>Shaheed Nur Hossain Memorial School</h1>

                <p>
                    School Result Management System
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input type="text" id="username" placeholder="Enter username" required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input type="password" id="password" placeholder="Enter password" required>

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <div id="message"></div>

        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                try {

                    const response =
                        await fetch("/api/admin/login", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username,
                                password
                            })

                        });


                    const data =
                        await response.json();


                    if (data.success) {

                        message.style.color = "green";

                        message.textContent =
                            "Login successful...";


                        setTimeout(() => {

                            window.location.href =
                                "/pages/admin.html";

                        }, 800);

                    } else {

                        message.style.color = "red";

                        message.textContent =
                            data.message;

                    }

                } catch (error) {

                    message.style.color = "red";

                    message.textContent =
                        "Server connection failed.";

                }

            });

    </script>

</body>

</html>
