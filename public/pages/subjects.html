
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subject Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        .header {
            background: #8335e9;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .header button {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .box h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(180px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .add-button {
            margin-top: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #1d4ed8;
        }

        .filter-area {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-area select {
            max-width: 250px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        td:first-child,
        td:nth-child(2) {
            text-align: left;
        }

        .delete {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .container {
                padding: 10px;
                margin: 15px auto;
            }

            .box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <div class="header">

        <h2>Subject Management</h2>

        <button onclick="goBack()">
            Back
        </button>

    </div>


    <div class="container">

        <!-- ========================= -->
        <!-- ADD SUBJECT -->
        <!-- ========================= -->

        <div class="box">

            <h2>Add Subject</h2>

            <form id="subjectForm">

                <div class="form-grid">

                    <!-- CLASS -->

                    <div>

                        <label>
                            Class
                        </label>

                        <select id="class_name" required>

                            <option value="">
                                Select Class
                            </option>

                            <option value="Play-1">
                                Play-1
                            </option>
                            
                            <option value="Play-2">
                                Play-2
                            </option>
                            
                            <option value="One">
                                One
                            </option>
                            
                            <option value="Two">
                                Two
                            </option>
                            
                            <option value="Three">
                                Three
                            </option>
                            
                            <option value="Four">
                                Four
                            </option>
                            
                            <option value="Five">
                                Five
                            </option>
                            
                            <option value="Six">
                                Six
                            </option>
                            
                            <option value="Seven">
                                Seven
                            </option>
                            
                            <option value="Eight">
                                Eight
                            </option>
                            
                            <option value="Nine">
                                Nine
                            </option>
                            
                            <option value="Ten">
                                Ten
                            </option>
                        </select>

                    </div>


                    <!-- SUBJECT NAME -->

                    <div>

                        <label>
                            Subject Name
                        </label>

                        <input type="text" id="subject_name" placeholder="Example: Bangla 1st Paper" required>

                    </div>


                    <!-- SUBJECT CODE -->

                    <div>

                        <label>
                            Subject Code
                        </label>

                        <input type="text" id="subject_code" placeholder="Example: 101" required>

                    </div>


                    <!-- FULL MARKS -->

                    <div>

                        <label>
                            Full Marks
                        </label>

                        <select id="full_marks" required>

                            <option value="">
                                Select Full Marks
                            </option>

                            <option value="50">
                                50 Marks
                            </option>

                            <option value="100">
                                100 Marks
                            </option>

                        </select>

                    </div>


                    <!-- SUBJECT TYPE -->

                    <div>

                        <label>
                            Subject Type
                        </label>

                        <select id="subject_type">

                            <option value="main">
                                Main Subject
                            </option>

                            <option value="fourth">
                                4th Subject
                            </option>

                        </select>

                    </div>

                </div>


                <button type="submit" class="add-button">
                    Add Subject
                </button>

            </form>

        </div>


        <!-- ========================= -->
        <!-- SUBJECT LIST -->
        <!-- ========================= -->

        <div class="box">

            <h2>
                Subject List
            </h2>


            <!-- FILTER -->

            <div class="filter-area">

                <select id="filterClass">

                    <option value="">
                        All Classes
                    </option>

                    <option value="Play-1">
                        Play-1
                    </option>
                    
                    <option value="Play-2">
                        Play-2
                    </option>
                    
                    <option value="One">
                        One
                    </option>
                    
                    <option value="Two">
                        Two
                    </option>
                    
                    <option value="Three">
                        Three
                    </option>
                    
                    <option value="Four">
                        Four
                    </option>
                    
                    <option value="Five">
                        Five
                    </option>
                    
                    <option value="Six">
                        Six
                    </option>
                    
                    <option value="Seven">
                        Seven
                    </option>
                    
                    <option value="Eight">
                        Eight
                    </option>
                    
                    <option value="Nine">
                        Nine
                    </option>
                    
                    <option value="Ten">
                        Ten
                    </option>

                </select>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Class
                            </th>

                            <th>
                                Subject
                            </th>

                            <th>
                                Code
                            </th>

                            <th>
                                Full Marks
                            </th>

                            <th>
                                Type
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="subjectList">

                        <tr>

                            <td colspan="6" class="empty">
                                Loading subjects...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        // ========================================
        // LOGIN CHECK
        // ========================================

        async function checkLogin() {

            try {

                const response =
                    await fetch(
                        "/api/admin/me"
                    );

                const data =
                    await response.json();

                if (!data.loggedIn) {

                    window.location.href =
                        "/pages/admin-login.html";

                }

            } catch (error) {

                console.error(
                    "Login check error:",
                    error
                );

            }

        }


        // ========================================
        // ALL SUBJECT DATA
        // ========================================

        let allSubjects = [];


        // ========================================
        // LOAD SUBJECTS
        // ========================================

        async function loadSubjects() {

            try {

                const response =
                    await fetch(
                        "/api/admin/subjects"
                    );

                const data =
                    await response.json();


                if (!data.success) {

                    alert(
                        data.message ||
                        "Could not load subjects."
                    );

                    return;

                }


                allSubjects =
                    data.subjects || [];


                displaySubjects(
                    allSubjects
                );


            } catch (error) {

                console.error(
                    "Load subjects error:",
                    error
                );

                alert(
                    "Could not load subjects."
                );

            }

        }


        // ========================================
        // DISPLAY SUBJECTS
        // ========================================

        function displaySubjects(
            subjects
        ) {

            const list =
                document.getElementById(
                    "subjectList"
                );


            list.innerHTML = "";


            if (
                !subjects ||
                subjects.length === 0
            ) {

                list.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="empty"
                        >
                            No subjects found.
                        </td>

                    </tr>

                `;

                return;

            }


            subjects.forEach(
                subject => {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            Class ${subject.class_name || "-"}
                        </td>

                        <td>
                            ${subject.subject_name || "-"}
                        </td>

                        <td>
                            ${subject.subject_code || "-"}
                        </td>

                        <td>
                            ${subject.full_marks || "-"}
                        </td>

                        <td>
                            ${subject.subject_type === "fourth"
                            ? "4th Subject"
                            : "Main Subject"
                        }
                        </td>

                        <td>

                            <button
                                class="delete"
                                onclick="
                                    deleteSubject(
                                        ${subject.id}
                                    )
                                "
                            >
                                Delete
                            </button>

                        </td>

                    `;


                    list.appendChild(row);

                }
            );

        }


        // ========================================
        // ADD SUBJECT
        // ========================================

        document
            .getElementById(
                "subjectForm"
            )
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const data = {

                        class_name:
                            document.getElementById(
                                "class_name"
                            ).value,

                        subject_name:
                            document.getElementById(
                                "subject_name"
                            ).value.trim(),

                        subject_code:
                            document.getElementById(
                                "subject_code"
                            ).value.trim(),

                        full_marks:
                            document.getElementById(
                                "full_marks"
                            ).value,

                        subject_type:
                            document.getElementById(
                                "subject_type"
                            ).value

                    };


                    try {

                        const response =
                            await fetch(
                                "/api/admin/subjects",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            data
                                        )
                                }
                            );


                        const result =
                            await response.json();


                        alert(
                            result.message ||
                            "Subject operation completed."
                        );


                        if (
                            result.success
                        ) {

                            document
                                .getElementById(
                                    "subjectForm"
                                )
                                .reset();


                            await loadSubjects();

                        }

                    } catch (error) {

                        console.error(
                            "Add subject error:",
                            error
                        );

                        alert(
                            "Could not add subject."
                        );

                    }

                }
            );


        // ========================================
        // FILTER BY CLASS
        // ========================================

        document
            .getElementById(
                "filterClass"
            )
            .addEventListener(
                "change",
                function () {

                    const selectedClass =
                        this.value;


                    if (!selectedClass) {

                        displaySubjects(
                            allSubjects
                        );

                        return;

                    }


                    const filtered =
                        allSubjects.filter(
                            subject =>
                                String(
                                    subject.class_name
                                ) ===
                                String(
                                    selectedClass
                                )
                        );


                    displaySubjects(
                        filtered
                    );

                }
            );


        // ========================================
        // DELETE SUBJECT
        // ========================================

        async function deleteSubject(
            id
        ) {

            if (
                !confirm(
                    "Are you sure you want to delete this subject?"
                )
            ) {

                return;

            }


            try {

                const response =
                    await fetch(
                        `/api/admin/subjects/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                alert(
                    data.message ||
                    "Delete operation completed."
                );


                if (
                    data.success
                ) {

                    await loadSubjects();

                }

            } catch (error) {

                console.error(
                    "Delete subject error:",
                    error
                );

                alert(
                    "Could not delete subject."
                );

            }

        }


        // ========================================
        // BACK
        // ========================================

        function goBack() {

            window.location.href =
                "/pages/admin.html";

        }


        // ========================================
        // START
        // ========================================

        checkLogin();

        loadSubjects();

    </script>

</body>

</html>
