<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shaheed Nur Hossain Memorial School</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #1e3a8a;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .box h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        /* =========================
           SEARCH FORM
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        select:disabled {
            background: #e2e8f0;
            cursor: not-allowed;
        }

        /* =========================
           SEARCH BUTTON
        ========================= */

        .search-button {
            margin-top: 20px;
            padding: 13px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-button:hover {
            background: #1d4ed8;
        }

        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .message.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
        }

        /* =========================
           STUDENT INFO
        ========================= */

        .student-info {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(220px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 7px;
            border-left: 4px solid #2563eb;
        }

        .info-item strong {
            display: block;
            color: #475569;
            margin-bottom: 5px;
        }

        /* =========================
           RESULT TABLE
        ========================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 650px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        td:first-child {
            text-align: left;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        /* =========================
           SUMMARY
        ========================= */

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .summary-card {
            background: #eff6ff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-card h3 {
            margin: 0 0 8px;
            font-size: 15px;
            color: #475569;
        }

        .summary-card .value {
            font-size: 26px;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* =========================
           RESULT AREA
        ========================= */

        #resultArea {
            display: none;
        }

        /* =========================
           PRINT
        ========================= */

        .print-button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #16a34a;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .print-button:hover {
            background: #15803d;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            display: none;
            margin-top: 15px;
            color: #1e3a8a;
            font-weight: bold;
        }

        /* =========================
           PRINT
        ========================= */

        @media print {

            .search-box,
            .print-button,
            .header {
                display: none !important;
            }

            body {
                background: white;
            }

            .container {
                max-width: 100%;
                margin: 0;
                padding: 0;
            }

            .box {
                box-shadow: none;
                border: none;
            }

            #resultArea {
                display: block !important;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
                padding: 10px;
            }

            .box {
                padding: 18px;
            }

            .header {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 24px;
            }

            .summary-card .value {
                font-size: 22px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <h1>
            Shaheed Nur Hossain Memorial School
        </h1>

        <p>
            Online Result Publication System
        </p>

    </header>


    <div class="container">

        <!-- =========================
             SEARCH
        ========================= -->

        <div class="box search-box">

            <h2>
                Search Result
            </h2>


            <div class="form-grid">

                <!-- ROLL -->

                <div class="form-group">

                    <label for="roll">
                        Roll
                    </label>

                    <input type="text" id="roll" placeholder="Enter Roll">

                </div>


                <!-- CLASS -->

                <div class="form-group">

                    <label for="className">
                        Class
                    </label>

                    <select id="className">

                        <option value="">
                            Select Class
                        </option>

                    </select>

                </div>


                <!-- EXAM -->

                <div class="form-group">

                    <label for="examName">
                        Exam Name
                    </label>

                    <select id="examName" disabled>

                        <option value="">
                            Select Exam
                        </option>

                    </select>

                </div>


                <!-- YEAR -->

                <div class="form-group">

                    <label for="examYear">
                        Exam Year
                    </label>

                    <select id="examYear" disabled>

                        <option value="">
                            Select Year
                        </option>

                    </select>

                </div>

            </div>


            <!-- SEARCH BUTTON -->

            <button type="button" class="search-button" id="searchButton" onclick="searchResult()">
                Search Result
            </button>


            <div id="loading" class="loading">
                Searching result...
            </div>


            <div id="message" class="message"></div>

        </div>


        <!-- =========================
             RESULT AREA
        ========================= -->

        <div id="resultArea">

            <!-- =========================
                 STUDENT INFO
            ========================= -->

            <div class="box">

                <h2>
                    Student Information
                </h2>

                <div class="student-info" id="studentInfo"></div>

            </div>


            <!-- =========================
                 SUBJECT RESULTS
            ========================= -->

            <div class="box">

                <h2>
                    Subject-wise Result
                </h2>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    Subject
                                </th>

                                <th>
                                    Code
                                </th>

                                <th>
                                    Full Marks
                                </th>

                                <th>
                                    Marks
                                </th>

                                <th>
                                    Grade
                                </th>

                                <th>
                                    Grade Point
                                </th>

                            </tr>

                        </thead>


                        <tbody id="resultTable">

                        </tbody>

                    </table>

                </div>


                <!-- =========================
                     SUMMARY
                ========================= -->

                <div class="summary" id="summary"></div>


                <!-- PRINT -->

                <button type="button" class="print-button" onclick="window.print()">
                    Print Result
                </button>

            </div>

        </div>

    </div>


    <script>

        let searchOptions = [];

        // ========================================
        // SHOW MESSAGE
        // ========================================

        function showMessage(text, type = "info") {

            const message = document.getElementById("message");

            message.textContent = text;

            message.className = "message " + type;

            message.style.display = "block";
        }


        // ========================================
        // HIDE MESSAGE
        // ========================================

        function hideMessage() {

            const message = document.getElementById("message");

            message.style.display = "none";
        }


        // ========================================
        // SEARCH RESULT
        // ========================================

        async function searchResult() {

            const roll =
                document.getElementById("roll").value.trim();

            const className =
                document.getElementById("className").value.trim();

            const examName =
                document.getElementById("examName").value.trim();

            const examYear =
                document.getElementById("examYear").value.trim();


            // Validation

            if (!roll || !className || !examName || !examYear) {

                showMessage(
                    "Please fill all fields.",
                    "error"
                );

                return;
            }


            const searchButton =
                document.getElementById("searchButton");

            const loading =
                document.getElementById("loading");


            searchButton.disabled = true;

            loading.style.display = "block";

            hideMessage();


            document.getElementById("resultArea").style.display = "none";


            try {

                // ====================================
                // API PARAMETERS
                // ====================================

                const params = new URLSearchParams({

                    roll: roll,

                    class_name: className,

                    exam_name: examName,

                    exam_year: examYear

                });


                // ====================================
                // API URL
                // ====================================

                const searchUrl =
                    "/api/result/search?" +
                    params.toString();


                console.log(
                    "Searching:",
                    searchUrl
                );


                // ====================================
                // FETCH
                // ====================================

                const response =
                    await fetch(searchUrl);


                const data =
                    await response.json();


                console.log(
                    "Result data:",
                    data
                );


                // ====================================
                // ERROR
                // ====================================

                if (!response.ok || !data.success) {

                    showMessage(
                        data.message ||
                        "Result not found.",
                        "error"
                    );

                    return;
                }


                // ====================================
                // DISPLAY RESULT
                // ====================================

                displayResult(data);


                showMessage(
                    "Result found successfully.",
                    "success"
                );

            }

            catch (error) {

                console.error(
                    "Search error:",
                    error
                );

                showMessage(
                    "Server connection failed. Please try again.",
                    "error"
                );

            }

            finally {

                searchButton.disabled = false;

                loading.style.display = "none";

            }

        }


        // ========================================
        // DISPLAY RESULT
        // ========================================

        function displayResult(data) {

            console.log(
                "Displaying result:",
                data
            );


            const student =
                data.student || {};

            const subjects =
                Array.isArray(data.subjects)
                    ? data.subjects
                    : [];

            const summary =
                data.summary || {};


            // ====================================
            // RESULT AREA
            // ====================================

            const resultArea =
                document.getElementById("resultArea");


            // ====================================
            // BOARD MARKSHEET BUTTON
            // ====================================

            const oldButton =
                document.getElementById("marksheetButton");


            if (oldButton) {

                oldButton.remove();

            }


            const marksheetButton =
                document.createElement("button");


            marksheetButton.id =
                "marksheetButton";


            marksheetButton.className =
                "print-button";


            marksheetButton.style.marginLeft =
                "10px";


            marksheetButton.textContent =
                "View Board-Style Marksheet";


            marksheetButton.onclick = function () {

                const marksheetUrl =
                    "/marksheet.html" +
                    "?roll=" +
                    encodeURIComponent(student.roll || "") +
                    "&class_name=" +
                    encodeURIComponent(student.class_name || "") +
                    "&exam_name=" +
                    encodeURIComponent(student.exam_name || "") +
                    "&exam_year=" +
                    encodeURIComponent(student.exam_year || "");


                window.open(
                    marksheetUrl,
                    "_blank"
                );

            };


            const resultBox =
                resultArea.querySelector(".box:last-child");


            if (resultBox) {

                resultBox.appendChild(
                    marksheetButton
                );

            }


            // ====================================
            // STUDENT INFORMATION
            // ====================================

            const studentInfo =
                document.getElementById("studentInfo");


            studentInfo.innerHTML = `
    
            <div class="info-item">
    
                <strong>Student Name</strong>
    
                ${student.name || "-"}
    
            </div>
    
    
            <div class="info-item">
    
                <strong>Roll</strong>
    
                ${student.roll || "-"}
    
            </div>
    
    
            <div class="info-item">
    
                <strong>Registration</strong>
    
                ${student.registration || "-"}
    
            </div>
    
    
            <div class="info-item">
    
                <strong>Class</strong>
    
                ${student.class_name || "-"}
    
            </div>
    
    
            <div class="info-item">
    
                <strong>Group</strong>
    
                ${student.group_name || "-"}
    
            </div>
    
    
            <div class="info-item">
    
                <strong>Exam</strong>
    
                ${student.exam_name || "-"}
    
            </div>
    
    
            <div class="info-item">
    
                <strong>Year</strong>
    
                ${student.exam_year || "-"}
    
            </div>
    
        `;


            // ====================================
            // SUBJECT TABLE
            // ====================================

            const table =
                document.getElementById("resultTable");


            table.innerHTML = "";


            if (subjects.length === 0) {

                table.innerHTML = `
    
                <tr>
    
                    <td colspan="6">
    
                        No subject result found.
    
                    </td>
    
                </tr>
    
            `;

            }


            subjects.forEach(function (subject) {

                const row =
                    document.createElement("tr");


                const gradePoint =
                    Number(
                        subject.grade_point || 0
                    );


                row.innerHTML = `
    
                <td>
                    ${subject.subject_name || "-"}
                </td>
    
                <td>
                    ${subject.subject_code || "-"}
                </td>
    
                <td>
                    ${subject.full_marks ?? "-"}
                </td>
    
                <td>
                    ${subject.marks ?? "-"}
                </td>
    
                <td>
                    ${subject.grade || "-"}
                </td>
    
                <td>
                    ${gradePoint.toFixed(2)}
                </td>
    
            `;


                table.appendChild(row);

            });


            // ====================================
            // SUMMARY
            // ====================================

            const totalMarks =
                Number(
                    summary.total_marks || 0
                );


            const totalFullMarks =
                Number(
                    summary.total_full_marks || 0
                );


            const gpa =
                Number(
                    summary.gpa || 0
                );


            const position =
                summary.position ?? "-";


            const result =
                summary.result || "-";


            document.getElementById("summary").innerHTML = `
    
            <div class="summary-card">
    
                <h3>Total Marks</h3>
    
                <div class="value">
    
                    ${totalMarks}
                    /
                    ${totalFullMarks}
    
                </div>
    
            </div>
    
    
            <div class="summary-card">
    
                <h3>GPA</h3>
    
                <div class="value">
    
                    ${gpa.toFixed(2)}
    
                </div>
    
            </div>
    
    
            <div class="summary-card">
    
                <h3>Result</h3>
    
                <div class="value">
    
                    ${result}
    
                </div>
    
            </div>
    
    
            <div class="summary-card">
    
                <h3>Position</h3>
    
                <div class="value">
    
                    ${position}
    
                </div>
    
            </div>
    
        `;


            // ====================================
            // SHOW RESULT
            // ====================================

            resultArea.style.display = "block";


            resultArea.scrollIntoView({

                behavior: "smooth",

                block: "start"

            });

        }


        // ========================================
        // LOAD SEARCH OPTIONS
        // ========================================

        async function loadSearchOptions() {

            try {

                const response =
                    await fetch(
                        "/api/result/options"
                    );


                const data =
                    await response.json();


                console.log(
                    "Search options:",
                    data
                );


                if (!response.ok || !data.success) {

                    enableStaticOptions();

                    return;

                }


                searchOptions =
                    Array.isArray(data.options)
                        ? data.options
                        : [];


                const classSelect =
                    document.getElementById("className");


                classSelect.innerHTML = `
    
                <option value="">
                    Select Class
                </option>
    
            `;


                const classes = [

                    ...new Set(

                        searchOptions

                            .map(
                                item => item.class_name
                            )

                            .filter(Boolean)

                    )

                ];


                classes.forEach(function (className) {

                    const option =
                        document.createElement("option");


                    option.value =
                        className;


                    option.textContent =
                        className;


                    classSelect.appendChild(
                        option
                    );

                });


                resetExamAndYear();

            }

            catch (error) {

                console.error(
                    "Options error:",
                    error
                );

                enableStaticOptions();

            }

        }


        // ========================================
        // STATIC CLASS OPTIONS
        // ========================================

        function enableStaticOptions() {

            const classSelect =
                document.getElementById("className");


            classSelect.innerHTML = `
    
            <option value="">Select Class</option>
    
            <option value="Play-1">Play-1</option>
    
            <option value="Play-2">Play-2</option>
    
            <option value="One">One</option>
    
            <option value="Two">Two</option>
    
            <option value="Three">Three</option>
    
            <option value="Four">Four</option>
    
            <option value="Five">Five</option>
    
            <option value="Six">Six</option>
    
            <option value="Seven">Seven</option>
    
            <option value="Eight">Eight</option>
    
            <option value="Nine">Nine</option>
    
            <option value="Ten">Ten</option>
    
        `;


            resetExamAndYear();

        }


        // ========================================
        // CLASS CHANGE
        // ========================================

        document
            .getElementById("className")
            .addEventListener(
                "change",
                function () {

                    const selectedClass =
                        this.value;


                    const examSelect =
                        document.getElementById(
                            "examName"
                        );


                    const yearSelect =
                        document.getElementById(
                            "examYear"
                        );


                    examSelect.innerHTML = `
    
                    <option value="">
                        Select Exam
                    </option>
    
                `;


                    yearSelect.innerHTML = `
    
                    <option value="">
                        Select Year
                    </option>
    
                `;


                    yearSelect.disabled = true;


                    if (!selectedClass) {

                        examSelect.disabled = true;

                        return;

                    }


                    const classOptions =
                        searchOptions.filter(
                            function (item) {

                                return String(
                                    item.class_name
                                ) === String(
                                    selectedClass
                                );

                            }
                        );


                    const exams = [

                        ...new Set(

                            classOptions

                                .map(
                                    item =>
                                        item.exam_name
                                )

                                .filter(Boolean)

                        )

                    ];


                    if (exams.length > 0) {

                        exams.forEach(function (examName) {

                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                examName;


                            option.textContent =
                                examName;


                            examSelect.appendChild(
                                option
                            );

                        });

                    }

                    else {

                        const defaultExams = [

                            "1st Term Exam",

                            "2nd Term Exam",

                            "Annual Examination"

                        ];


                        defaultExams.forEach(
                            function (examName) {

                                const option =
                                    document.createElement(
                                        "option"
                                    );


                                option.value =
                                    examName;


                                option.textContent =
                                    examName;


                                examSelect.appendChild(
                                    option
                                );

                            }
                        );

                    }


                    examSelect.disabled = false;

                }
            );


        // ========================================
        // EXAM CHANGE
        // ========================================

        document
            .getElementById("examName")
            .addEventListener(
                "change",
                function () {

                    const selectedClass =
                        document
                            .getElementById("className")
                            .value;


                    const selectedExam =
                        this.value;


                    const yearSelect =
                        document.getElementById(
                            "examYear"
                        );


                    yearSelect.innerHTML = `
    
                    <option value="">
                        Select Year
                    </option>
    
                `;


                    yearSelect.disabled = true;


                    if (
                        !selectedClass ||
                        !selectedExam
                    ) {

                        return;

                    }


                    const matchingOptions =
                        searchOptions.filter(
                            function (item) {

                                return (

                                    String(
                                        item.class_name
                                    ) ===
                                    String(
                                        selectedClass
                                    )

                                    &&

                                    String(
                                        item.exam_name
                                    ) ===
                                    String(
                                        selectedExam
                                    )

                                );

                            }
                        );


                    const years = [

                        ...new Set(

                            matchingOptions

                                .map(
                                    item =>
                                        item.exam_year
                                )

                                .filter(Boolean)

                        )

                    ];


                    if (years.length > 0) {

                        years.forEach(function (year) {

                            const option =
                                document.createElement(
                                    "option"
                                );


                            option.value =
                                year;


                            option.textContent =
                                year;


                            yearSelect.appendChild(
                                option
                            );

                        });

                    }

                    else {

                        [2026, 2025, 2024].forEach(
                            function (year) {

                                const option =
                                    document.createElement(
                                        "option"
                                    );


                                option.value =
                                    year;


                                option.textContent =
                                    year;


                                yearSelect.appendChild(
                                    option
                                );

                            }
                        );

                    }


                    yearSelect.disabled = false;

                }
            );


        // ========================================
        // RESET
        // ========================================

        function resetExamAndYear() {

            const examSelect =
                document.getElementById(
                    "examName"
                );


            const yearSelect =
                document.getElementById(
                    "examYear"
                );


            examSelect.innerHTML = `
    
            <option value="">
                Select Exam
            </option>
    
        `;


            yearSelect.innerHTML = `
    
            <option value="">
                Select Year
            </option>
    
        `;


            examSelect.disabled = true;

            yearSelect.disabled = true;

        }


        // ========================================
        // ENTER KEY
        // ========================================

        document
            .getElementById("roll")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        searchResult();

                    }

                }
            );


        // ========================================
        // START
        // ========================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadSearchOptions();

            }
        );

    </script>

</body>

</html>
