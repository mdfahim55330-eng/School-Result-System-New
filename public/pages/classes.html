<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Management</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }
        .header {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 { margin: 0; }
        .header button {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            min-width: 220px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            background: #2563eb;
            color: white;
        }
        .delete { background: #dc2626; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        th { background: #1e3a8a; color: white; }
        .empty { color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Class Management</h2>
        <button onclick="goBack()">Back</button>
    </div>

    <div class="container">
        <div class="box">
            <h2>Add Class</h2>
            <form id="classForm">
                <input
                    type="text"
                    id="class_name"
                    placeholder="Example: Nursery, Class 6, HSC 1st Year"
                    required
                >
                <button type="submit">Add Class</button>
            </form>
        </div>

        <div class="box">
            <h2>Class List</h2>
            <table>
                <thead>
                    <tr>
                        <th>SL</th>
                        <th>Class Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="classList">
                    <tr>
                        <td colspan="3" class="empty">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function checkLogin() {
            const response = await fetch("/api/admin/me");
            const data = await response.json();

            if (!data.loggedIn) {
                window.location.href =
                    "/pages/admin-login.html";
            }
        }

        async function loadClasses() {
            try {
                const response =
                    await fetch("/api/admin/classes");

                const data =
                    await response.json();

                const list =
                    document.getElementById("classList");

                if (!data.success) {
                    throw new Error(
                        data.message ||
                        "Could not load classes."
                    );
                }

                list.innerHTML = "";

                if (!data.classes ||
                    data.classes.length === 0) {

                    list.innerHTML = `
                        <tr>
                            <td colspan="3" class="empty">
                                No classes found.
                            </td>
                        </tr>
                    `;

                    return;
                }

                data.classes.forEach((item, index) => {

                    const row =
                        document.createElement("tr");

                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item.class_name}</td>
                        <td>
                            <button
                                class="delete"
                                onclick="deleteClass(${item.id})"
                            >
                                Delete
                            </button>
                        </td>
                    `;

                    list.appendChild(row);
                });

            } catch (error) {
                console.error(
                    "Load classes error:",
                    error
                );

                alert(
                    "Could not load classes."
                );
            }
        }

        document
            .getElementById("classForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const className =
                        document
                            .getElementById("class_name")
                            .value
                            .trim();

                    const response =
                        await fetch(
                            "/api/admin/classes",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body: JSON.stringify({
                                    class_name: className
                                })
                            }
                        );

                    const data =
                        await response.json();

                    alert(
                        data.message ||
                        "Class operation completed."
                    );

                    if (data.success) {
                        this.reset();
                        loadClasses();
                    }
                }
            );

        async function deleteClass(id) {

            if (!confirm(
                "Are you sure you want to delete this class?"
            )) {
                return;
            }

            const response =
                await fetch(
                    `/api/admin/classes/${id}`,
                    { method: "DELETE" }
                );

            const data =
                await response.json();

            alert(
                data.message ||
                "Delete operation completed."
            );

            if (data.success) {
                loadClasses();
            }
        }

        function goBack() {
            window.location.href =
                "/pages/admin.html";
        }

        checkLogin();
        loadClasses();
    </script>
</body>
</html>
