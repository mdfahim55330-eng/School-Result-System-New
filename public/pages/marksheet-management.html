<!DOCTYPE html>

<html lang="en">



<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <title>Marksheet Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* =========================
       HEADER
        ========================= */

        .header {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .back {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .back:hover {
            background: #e2e8f0;
        }

        /* =========================
       CONTAINER
        ========================= */

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .box {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* =========================
       TITLE ROW
        ========================= */

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .title-row h2 {
            margin: 0;
        }

        /* =========================
       DOWNLOAD ALL
        ========================= */

        .download-all {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .download-all:hover {
            background: #15803d;
        }

        .download-all:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* =========================
       FILTERS
        ========================= */

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr auto;
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .filters select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: white;
            font-size: 14px;
        }

        .search-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-button:hover {
            background: #1d4ed8;
        }

        /* =========================
       MESSAGE
        ========================= */

        .message {
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 20px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        /* =========================
       RESULT INFO
        ========================= */

        .result-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #475569;
        }

        .student-count {
            font-weight: bold;
        }

        /* =========================
       TABLE
        ========================= */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* =========================
       ACTION BUTTONS
        ========================= */

        .action-button {
            border: none;
            padding: 8px 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
        }

        .view-button {
            background: #2563eb;
            color: white;
        }

        .view-button:hover {
            background: #1d4ed8;
        }

        .download-button {
            background: #16a34a;
            color: white;
        }

        .download-button:hover {
            background: #15803d;
        }

        /* =========================
       EMPTY
        ========================= */

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        /* =========================
       PROGRESS
        ========================= */

        .progress-box {
            display: none;
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 18px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
        }

        .progress-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #1e40af;
        }

        .progress-text {
            color: #475569;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #dbeafe;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.2s ease;
        }

        /* =========================
       MOBILE
        ========================= */

        @media (max-width: 800px) {

            .header {
                padding: 15px;
            }

            .header h2 {
                font-size: 17px;
            }

            .container {
                padding: 15px;
            }

            .title-row {
                flex-direction: column;
                align-items: stretch;
            }

            .download-all {
                width: 100%;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .search-button {
                width: 100%;
            }
        }
    </style>
    

</head>

<body>

    
    <!-- =========================
     HEADER
    ========================= -->

    <header class="header">

        <h2>
            Marksheet Management
        </h2>

    </header>


    <!-- =========================

    ========================= -->

    <div class="container">

            <!-- =========================

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>

                            </th>

                            <th>
                                Roll
                            </th>

                            <th>

                            </th>

                            <th>

                            </th>

                            <th>

                            </th>

                            <th>

    <!-- =========================
     JAVASCRIPT
    ========================= -->

    <script>

        /* =====================================================
           GLOBAL DATA
        ===================================================== */

        window.currentMarksheetStudents = [];


        /* =====================================================
           CHECK ADMIN LOGIN
        ===================================================== */

        async function checkLogin() {

            try {

                const response =
                    await fetch("/api/admin/me");

                const data =
                    await response.json();

                if (!data.loggedIn) {

                    window.location.href =
                        "/pages/admin-login.html";

                    return false;
                }

                return true;

            }

            catch (error) {

                console.error(
                    "Login check error:",
                    error
                );

                window.location.href =
                    "/pages/admin-login.html";

                return false;
            }
        }


        /* =====================================================
           BACK TO DASHBOARD
        ===================================================== */

        function goBack() {

            window.location.href =
                "/pages/admin.html";
        }


        /* =====================================================
           SHOW MESSAGE
        ===================================================== */

        function showMessage(
            message,
            type = "error"
        ) {

            const box =
                document.getElementById("message");

            box.textContent =
                message;

            box.className =
                "message " + type;
        }


        /* =====================================================
           CLEAR MESSAGE
        ===================================================== */

        function clearMessage() {

            const box =
                document.getElementById("message");

            box.textContent = "";

            box.className =
                "message";
        }


        /* =====================================================
           LOAD CLASSES
        ===================================================== */

        async function loadClasses() {

            const select =
                document.getElementById(
                    "classSelect"
                );

            try {

                const response =
                    await fetch(
                        "/api/admin/marksheet/classes"
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not load classes."
                    );
                }

                select.innerHTML =
                    `<option value="">
                    Select Class
                </option>`;

                data.classes.forEach(
                    className => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            className;

                        option.textContent =
                            className;

                        select.appendChild(
                            option
                        );
                    }
                );

            }

            catch (error) {

                console.error(
                    "Load classes error:",
                    error
                );

                showMessage(
                    "Class list could not be loaded."
                );
            }
        }


        /* =====================================================
           LOAD YEARS
        ===================================================== */

        async function loadYears() {

            const select =
                document.getElementById(
                    "yearSelect"
                );

            try {

                const response =
                    await fetch(
                        "/api/admin/marksheet/years"
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not load years."
                    );
                }

                select.innerHTML =
                    `<option value="">
                    Select Exam Year
                </option>`;

                data.years.forEach(
                    year => {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            year;

                        option.textContent =
                            year;

                        select.appendChild(
                            option
                        );
                    }
                );

            }

            catch (error) {

                console.error(
                    "Load years error:",
                    error
                );

                showMessage(
                    "Exam year list could not be loaded."
                );
            }
        }


        /* =====================================================
           LOAD EXAMS
           CLASS + YEAR অনুযায়ী
        ===================================================== */

        async function loadExams() {

            const className =
                document.getElementById(
                    "classSelect"
                ).value;

            const examYear =
                document.getElementById(
                    "yearSelect"
                ).value;

            const examSelect =
                document.getElementById(
                    "examSelect"
                );

            examSelect.innerHTML =
                '<option value="">Select Exam</option>';

            if (
                !className ||
                !examYear
            ) {

                return;
            }

            try {

                const response =
                    await fetch(
                        "/api/admin/exams"
                    );

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Exam list could not be loaded."
                    );
                }

                const uniqueExams =
                    new Set();

                data.exams.forEach(
                    exam => {

                        if (

                            String(
                                exam.class_name
                            ).trim()
                            ===
                            String(
                                className
                            ).trim()

                            &&

                            Number(
                                exam.exam_year
                            )
                            ===
                            Number(
                                examYear
                            )

                        ) {

                            const examName =
                                String(
                                    exam.exam_name
                                ).trim();

                            if (
                                examName &&
                                !uniqueExams.has(
                                    examName
                                )
                            ) {

                                uniqueExams.add(
                                    examName
                                );

                                const option =
                                    document.createElement(
                                        "option"
                                    );

                                option.value =
                                    examName;

                                option.textContent =
                                    examName;

                                examSelect.appendChild(
                                    option
                                );
                            }
                        }
                    }
                );

            }

            catch (error) {

                console.error(
                    "Load exams error:",
                    error
                );

                examSelect.innerHTML =
                    '<option value="">Exam load failed</option>';
            }
        }


        /* =====================================================
           SEARCH MARKSHEETS
        ===================================================== */

        async function searchMarksheets() {

            clearMessage();

            const className =
                document.getElementById(
                    "classSelect"
                ).value;

            const examYear =
                document.getElementById(
                    "yearSelect"
                ).value;

            const examName =
                document.getElementById(
                    "examSelect"
                ).value;

            const table =
                document.getElementById(
                    "studentTable"
                );

            if (!className) {

                showMessage(
                    "Please select a class."
                );

                return;
            }

            if (!examYear) {

                showMessage(
                    "Please select an exam year."
                );

                return;
            }

            if (!examName) {

                showMessage(
                    "Please select an exam name."
                );

                return;
            }

            table.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="empty">

                    Loading students...

                </td>
            </tr>
        `;

            try {

                const url =
                    "/api/admin/marksheets" +
                    "?class_name=" +
                    encodeURIComponent(
                        className
                    ) +
                    "&exam_year=" +
                    encodeURIComponent(
                        examYear
                    ) +
                    "&exam_name=" +
                    encodeURIComponent(
                        examName
                    );

                const response =
                    await fetch(url);

                const data =
                    await response.json();

                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not load marksheets."
                    );
                }

                window.currentMarksheetStudents =
                    data.students || [];

                renderStudents(
                    window.currentMarksheetStudents
                );

            }

            catch (error) {

                console.error(
                    "Search marksheets error:",
                    error
                );

                window.currentMarksheetStudents =
                    [];

                table.innerHTML = `
                <tr>
                    <td
                        colspan="9"
                        class="empty">

                        No result found.

                    </td>
                </tr>
            `;

                document.getElementById(
                    "resultInfo"
                ).style.display = "none";

                document.getElementById(
                    "downloadAllButton"
                ).disabled = true;

                showMessage(
                    error.message ||
                    "Marksheets could not be loaded."
                );
            }
        }


        /* =====================================================
           RENDER STUDENTS
        ===================================================== */

        function renderStudents(students) {

            const table =
                document.getElementById(
                    "studentTable"
                );

            const count =
                document.getElementById(
                    "studentCount"
                );

            const resultInfo =
                document.getElementById(
                    "resultInfo"
                );

            const downloadAll =
                document.getElementById(
                    "downloadAllButton"
                );

            count.textContent =
                students.length;

            resultInfo.style.display =
                "flex";

            if (!students.length) {

                table.innerHTML = `
                <tr>
                    <td
                        colspan="9"
                        class="empty">

                        No students found for the
                        selected Class, Exam Year and Exam.

                    </td>
                </tr>
            `;

                downloadAll.disabled =
                    true;

                return;
            }

            downloadAll.disabled =
                false;

            table.innerHTML = "";

            students.forEach(
                (student, index) => {

                    const row =
                        document.createElement(
                            "tr"
                        );

                    row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${escapeHtml(
                        student.name || "-"
                    )}
                    </td>

                    <td>
                        ${escapeHtml(
                        student.roll || "-"
                    )}
                    </td>

                    <td>
                        ${escapeHtml(
                        student.registration || "-"
                    )}
                    </td>

                    <td>
                        ${escapeHtml(
                        student.class_name || "-"
                    )}
                    </td>

                    <td>
                        ${escapeHtml(
                        student.exam_name || "-"
                    )}
                    </td>

                    <td>
                        ${escapeHtml(
                        String(
                            student.exam_year || "-"
                        )
                    )}
                    </td>

                    <td>
                        ${escapeHtml(
                        student.status || "-"
                    )}
                    </td>

                    <td>

                        <button
                            class="action-button view-button"
                            onclick='viewMarksheet(${JSON.stringify(
                        student
                    )})'>

                            View

                        </button>

                        <button
                            class="action-button download-button"
                            onclick='downloadMarksheet(${JSON.stringify(
                        student
                    )})'>

                            Download

                        </button>

                    </td>
                `;

                    table.appendChild(
                        row
                    );
                }
            );
        }


        /* =====================================================
           CREATE MARKSHEET URL
        ===================================================== */

        function createMarksheetUrl(student) {

            const params =
                new URLSearchParams();

            params.set(
                "roll",
                student.roll
            );

            params.set(
                "class_name",
                student.class_name
            );

            params.set(
                "exam_name",
                student.exam_name
            );

            params.set(
                "exam_year",
                student.exam_year
            );

            return (
                "/marksheet.html?" +
                params.toString()
            );
        }


        /* =====================================================
           VIEW MARKSHEET
        ===================================================== */

        function viewMarksheet(student) {

            const url =
                createMarksheetUrl(
                    student
                );

            console.log(
                "Opening marksheet:",
                url
            );

            const newWindow =
                window.open(
                    url,
                    "_blank"
                );

            if (!newWindow) {

                alert(
                    "Popup blocked. Please allow pop-ups for this website."
                );
            }
        }


        

            function safeFileName(value) {
                return String(value || "marksheet")
                    .replace(/[\\/:*?"<>|]/g, "_")
                    .trim();
            }


            // ...existing code...

                async function waitForMarksheetResult(doc, timeout = 8000) {
                        const startTime = Date.now();

                        while (Date.now() - startTime < timeout) {
                            const bodyText = (doc.body?.innerText || "").trim();

                            const hasResult =
                                bodyText.length > 100 &&
                                !/loading|fetching|please wait/i.test(bodyText);

                            if (hasResult) {
                                return;
                            }

                            await new Promise(resolve =>
                                setTimeout(resolve, 150)
                            );
                        }

                        throw new Error("Result load timeout.");
                    }


                    async function createMarksheetFrame(student) {
                            const iframe = document.createElement("iframe");

                            Object.assign(iframe.style, {
                                position: "fixed",
                                left: "-10000px",
                                top: "0",
                                width: "794px",
                                height: "1123px",
                                border: "0",
                                background: "#ffffff"
                            });

                            document.body.appendChild(iframe);

                            await new Promise((resolve, reject) => {
                                iframe.onload = resolve;
                                iframe.onerror = () =>
                                    reject(new Error("Marksheet page could not load."));

                                iframe.src = createMarksheetUrl(student);
                            });

                            const frameDocument =
                                iframe.contentDocument ||
                                iframe.contentWindow.document;

                            await waitForMarksheetResult(frameDocument);

                            const style = frameDocument.createElement("style");

                            style.textContent = `
                                html, body {
                                    width: 794px !important;
                                    min-height: 1123px !important;
                                    margin: 0 !important;
                                    background: #ffffff !important;
                                    overflow: hidden !important;
                                }

                                .print-button,
                                #printButton,
                                [onclick*="print"],
                                [onclick*="Print"] {
                                    display: none !important;
                                    visibility: hidden !important;
                                }
                            `;

                            frameDocument.head.appendChild(style);

                            // Print Marksheet button text অনুযায়ী লুকানো
                            frameDocument
                                .querySelectorAll("button, input, a")
                                .forEach(element => {
                                    const text = (
                                        element.innerText ||
                                        element.value ||
                                        element.textContent ||
                                        ""
                                    ).toLowerCase();

                                    if (text.includes("print")) {
                                        element.style.display = "none";
                                    }
                                });

                            if (frameDocument.fonts) {
                                await frameDocument.fonts.ready;
                            }

                            await Promise.all(
                                Array.from(frameDocument.images).map(image => {
                                    if (image.complete) {
                                        return Promise.resolve();
                                 }

                                    return new Promise(resolve => {
                                        image.onload = resolve;
                                        image.onerror = resolve;
                                    });
                                })
                            );

                        return iframe;
                    }

                    


            async function createMarksheetsPdf(students, fileName) {
                if (!window.html2canvas || !window.jspdf) {
                    throw new Error("PDF library not loaded.");
                }

                const { jsPDF } = window.jspdf;

                const pdf = new jsPDF({
                    orientation: "portrait",
                    unit: "mm",
                    format: "a4",
                    compress: true
                });

                const progressText =
                    document.getElementById("progressText");

                const progressFill =
                    document.getElementById("progressFill");

                for (let index = 0; index < students.length; index++) {
                    const student = students[index];

                    progressText.textContent =
                        `${index + 1} / ${students.length} — ${student.name || ""}`;

                    progressFill.style.width =
                        `${((index + 1) / students.length) * 100}%`;

                    const iframe =
                        await createMarksheetFrame(student);

                    try {
                        const canvas = await html2canvas(
                            iframe.contentDocument.body,
                            {
                                scale: 1.3,
                                useCORS: true,
                                backgroundColor: "#ffffff",
                                width: 794,
                                windowWidth: 794
                            }
                        );

                        if (index > 0) {
                            pdf.addPage();
                        }

                        const pageWidth = 210;
                        const pageHeight = 297;

                        const scale = Math.min(
                            pageWidth / canvas.width,
                            pageHeight / canvas.height
                        );

                        const imageWidth = canvas.width * scale;
                        const imageHeight = canvas.height * scale;

                        const x = (pageWidth - imageWidth) / 2;
                        const y = (pageHeight - imageHeight) / 2;

                        pdf.addImage(
                            canvas.toDataURL("image/jpeg", 0.95),
                            "JPEG",
                            x,
                            y,
                            imageWidth,
                            imageHeight
                        );
                    } finally {
                        iframe.remove();
                    }
                }

                pdf.save(fileName);
            }


            async function downloadMarksheet(student) {
                try {
                    clearMessage();

                    await createMarksheetsPdf(
                        [student],
                        `${safeFileName(student.name)}-${safeFileName(student.roll)}.pdf`
                    );

                    showMessage(
                        "Marksheet PDF downloaded successfully.",
                        "success"
                    );
                } catch (error) {
                    console.error("Single PDF error:", error);
                    showMessage("PDF download failed.");
                }
            }


            async function downloadAllMarksheets() {
                const students =
                    window.currentMarksheetStudents || [];

                if (!students.length) {
                    showMessage("There are no students to download.");
                    return;
                }

                const progressBox =
                    document.getElementById("progressBox");

                const downloadButton =
                    document.getElementById("downloadAllButton");

                progressBox.style.display = "block";
                downloadButton.disabled = true;

                clearMessage();

                try {
                    const className =
                        document.getElementById("classSelect").value;

                    const examYear =
                        document.getElementById("yearSelect").value;

                    const examName =
                        document.getElementById("examSelect").value;

                    const fileName =
                        `${safeFileName(className)}-` +
                        `${safeFileName(examName)}-` +
                        `${safeFileName(examYear)}-marksheets.pdf`;

                    await createMarksheetsPdf(
                        students,
                        fileName
                    );

                    showMessage(
                        "All marksheets downloaded in one PDF file.",
                        "success"
                    );
                } catch (error) {
                    console.error("All PDF error:", error);
                    showMessage("All marksheets PDF download failed.");
                } finally {
                    downloadButton.disabled = false;
                }
            }

            


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =====================================================
           EVENT LISTENERS
        ===================================================== */

        document
            .getElementById("classSelect")
            .addEventListener(
                "change",
                loadExams
            );

        document
            .getElementById("yearSelect")
            .addEventListener(
                "change",
                loadExams
            );


        /* =====================================================
           INITIAL LOAD
        ===================================================== */

        async function initializePage() {

            const loggedIn =
                await checkLogin();

            if (!loggedIn) {
                return;
            }

            await Promise.all([
                loadClasses(),
                loadYears()
            ]);

            /*
             * Exam প্রথমে load হবে না।
             * Class + Year select করার পরে load হবে।
             */

            document.getElementById(
                "examSelect"
            ).innerHTML =
                '<option value="">Select Exam</option>';
        }


        initializePage();

    </script>
