<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f1f5f9;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 15px;
        }

        input,
        select {

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            width: 100%;
        }

        button {

            padding: 11px 18px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            cursor: pointer;
        }

        .delete {
            background: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom:
                1px solid #e2e8f0;
        }
    </style>

</head>

<body>


    <div class="header">

        <h2>
            Exam Management
        </h2>

        <button onclick="goBack()">
            Back
        </button>

    </div>


    <div class="container">


        <div class="box">

            <h2>
                Add Exam
            </h2>


            <form id="examForm">

                <div class="form-grid">


                    <input type="text" id="exam_name" placeholder="Exam Name" required>


                    <input type="number" id="exam_year" placeholder="Exam Year" min="2000" max="2100" required>


                    <select id="class_name" required>
                        <option value="">Select Class</option>
                    </select>


                </div>

                <br>

                <button type="submit">
                    Add Exam
                </button>

            </form>

        </div>


        <div class="box">

            <h2>
                Exam List
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Exam Name
                        </th>

                        <th>
                            Year
                        </th>

                        <th>
                            Class
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="examList">
                </tbody>

            </table>

        </div>


    </div>


    <script>

        async function checkLogin() {

            const response =
                await fetch("/api/admin/me");

            const data =
                await response.json();


            if (!data.loggedIn) {

                window.location.href =
                    "/pages/admin-login.html";

            }

        }


        async function loadClasses() {

            try {

                const response = await fetch("/api/admin/classes");
                const data = await response.json();

                if (!data.success) {
                    throw new Error(
                        data.message || "Could not load classes."
                    );
                }

                const select =
                    document.getElementById("class_name");

                select.innerHTML =
                    '<option value="">Select Class</option>';

                (data.classes || []).forEach(item => {

                    const option =
                        document.createElement("option");

                    option.value = item.class_name;
                    option.textContent = item.class_name;

                    select.appendChild(option);

                });

            } catch (error) {

                console.error(
                    "Load classes error:",
                    error
                );

                alert("Could not load classes.");

            }

        }


        async function loadExams() {

            const response =
                await fetch("/api/admin/exams");

            const data =
                await response.json();


            if (!data.success) {

                alert(data.message);

                return;
            }


            const list =
                document.getElementById(
                    "examList"
                );


            list.innerHTML = "";


            data.exams.forEach(exam => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

            <td>
                ${exam.exam_name}
            </td>

            <td>
                ${exam.exam_year}
            </td>

            <td>
                Class ${exam.class_name}
            </td>

            <td>

                <button
                    class="delete"
                    onclick="deleteExam(${exam.id})"
                >
                    Delete
                </button>

            </td>

        `;


                list.appendChild(row);

            });

        }


        document
            .getElementById("examForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const data = {

                        exam_name:
                            document.getElementById(
                                "exam_name"
                            ).value,

                        exam_year:
                            document.getElementById(
                                "exam_year"
                            ).value,

                        class_name:
                            document.getElementById(
                                "class_name"
                            ).value

                    };


                    const response =
                        await fetch(
                            "/api/admin/exams",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(data)

                            }
                        );


                    const result =
                        await response.json();


                    alert(result.message);


                    if (result.success) {

                        this.reset();

                        loadExams();

                    }

                }
            );


        async function deleteExam(id) {

            if (
                !confirm(
                    "Are you sure you want to delete this exam?"
                )
            ) {

                return;

            }


            const response =
                await fetch(
                    `/api/admin/exams/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const data =
                await response.json();


            alert(data.message);


            if (data.success) {

                loadExams();

            }

        }


        function goBack() {

            window.location.href =
                "/pages/admin.html";

        }


        checkLogin();
        loadClasses();
        loadExams();

    </script>

</body>

</html>
